# Stack do CRM WTA para Docker Swarm (Portainer: Stacks > Add stack).
#
# Antes de implantar:
#   1. Rode deploy/criar-segredos.sh na VPS (cria os segredos crmwta_*).
#   2. Defina as variáveis da stack: DOMINIO, REDE_TRAEFIK, IMAGEM_API, IMAGEM_WEB
#      e, só na primeira vez, BOOTSTRAP_EMAIL e BOOTSTRAP_NAME.
#
# Versão: IMAGEM_API e IMAGEM_WEB com a etiqueta ":main" pegam sempre a última
# versão aprovada no CI, quando a stack é atualizada no Portainer com
# "Re-pull image and redeploy". Com uma versão fixa (AAAA.MM.DD-xxxxxxx), a
# stack fica nela até a variável mudar.
#
# Nenhuma porta é publicada. Só "web" e "api" entram na rede do Traefik.
# Banco e backup ficam na rede interna da própria stack.
#
# Rótulos do Traefik: o Traefik da VPS usa o provedor "docker", que lê os
# rótulos do contêiner (labels do serviço). Os mesmos rótulos vão em
# deploy.labels, que é onde o provedor "swarm" lê, para a stack funcionar com
# qualquer um dos dois.

version: "3.8"

x-api-env: &api-env
  NODE_ENV: production
  APP_URL: https://${DOMINIO}
  APP_NAME: ${APP_NAME:-CRM WTA}
  MASTER_KEYS_FILE: /run/secrets/crmwta_master_keys
  COOKIE_SECURE: "true"
  TRUST_PROXY: "true"
  MAIL_MODE: ${MAIL_MODE:-log}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_FROM: ${SMTP_FROM:-}
  # Senha do e-mail: a variável SMTP_PASS da stack, se preenchida; senão, o
  # segredo crmwta_smtp_pass.
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_PASS_FILE: /run/secrets/crmwta_smtp_pass
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Verificação em duas etapas obrigatória nas áreas administrativas. Em testes,
  # EXIGIR_2FA=false desliga a exigência (cada pessoa ainda pode ativar a sua).
  REQUIRE_MFA: ${EXIGIR_2FA:-true}
  # Endereço do webhook da Greenn: https://<DOMINIO>/api/v1/webhooks/greenn/<SEGREDO_DA_GREENN>.
  # Use um texto longo e aleatório (16 caracteres ou mais). Sem ele, o webhook não existe.
  GREENN_SECRET: ${SEGREDO_DA_GREENN:-}
  # Para onde o domínio próprio de cada cliente aponta (CNAME). Padrão: o DOMINIO.
  CLIENT_DOMAIN_TARGET: ${DOMINIO_ALVO_CLIENTES:-}
  # WhatsApp: endereço da Evolution API (sem barra no final) e a chave global
  # dela (AUTHENTICATION_API_KEY da stack da Evolution). Sem os dois, o WhatsApp
  # fica indisponível no CRM. O CRM só mexe nas instâncias "crmwta-*".
  EVOLUTION_URL: ${EVOLUTION_URL:-}
  EVOLUTION_API_KEY: ${EVOLUTION_CHAVE:-}
  # Opcional: endereço do CRM que a Evolution usa para avisar mensagens, se o
  # endereço público não for alcançável de dentro da VPS. Padrão: https://<DOMINIO>.
  EVOLUTION_WEBHOOK_BASE: ${ENDERECO_DO_CRM_PARA_EVOLUTION:-}
  STORAGE_DIR: /data/files

x-api-labels: &api-labels
  - traefik.enable=true
  - traefik.docker.network=${REDE_TRAEFIK}
  - traefik.http.routers.crmwta-api.rule=Host(`${DOMINIO}`) && PathPrefix(`/api`)
  - traefik.http.routers.crmwta-api.priority=100
  - traefik.http.routers.crmwta-api.entrypoints=${ENTRADA_TRAEFIK:-websecure}
  - traefik.http.routers.crmwta-api.tls=true
  - traefik.http.routers.crmwta-api.tls.certresolver=${RESOLVEDOR_TLS:-letsencryptresolver}
  - traefik.http.services.crmwta-api.loadbalancer.server.port=3001
  # Domínios próprios dos clientes, atrás do Cloudflare for SaaS (o Cloudflare
  # emite o certificado do cliente). Desligado enquanto REGRA_DOMINIOS_CLIENTES
  # não for definida; ver docs/DEPLOYMENT.md, "Domínio próprio dos clientes".
  - traefik.http.routers.crmwta-api-clientes.rule=(${REGRA_DOMINIOS_CLIENTES:-Host(`dominios-clientes-desligados.invalid`)}) && PathPrefix(`/api`)
  - traefik.http.routers.crmwta-api-clientes.priority=2
  - traefik.http.routers.crmwta-api-clientes.entrypoints=${ENTRADA_TRAEFIK:-websecure}
  - traefik.http.routers.crmwta-api-clientes.tls=true
  - traefik.http.routers.crmwta-api-clientes.service=crmwta-api

x-web-labels: &web-labels
  - traefik.enable=true
  - traefik.docker.network=${REDE_TRAEFIK}
  - traefik.http.routers.crmwta-web.rule=Host(`${DOMINIO}`)
  - traefik.http.routers.crmwta-web.priority=10
  - traefik.http.routers.crmwta-web.entrypoints=${ENTRADA_TRAEFIK:-websecure}
  - traefik.http.routers.crmwta-web.tls=true
  - traefik.http.routers.crmwta-web.tls.certresolver=${RESOLVEDOR_TLS:-letsencryptresolver}
  - traefik.http.services.crmwta-web.loadbalancer.server.port=3000
  - traefik.http.routers.crmwta-web-clientes.rule=${REGRA_DOMINIOS_CLIENTES:-Host(`dominios-clientes-desligados.invalid`)}
  - traefik.http.routers.crmwta-web-clientes.priority=1
  - traefik.http.routers.crmwta-web-clientes.entrypoints=${ENTRADA_TRAEFIK:-websecure}
  - traefik.http.routers.crmwta-web-clientes.tls=true
  - traefik.http.routers.crmwta-web-clientes.service=crmwta-web

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: crm
      POSTGRES_PASSWORD_FILE: /run/secrets/crmwta_db_password
    secrets: [crmwta_db_password]
    volumes:
      - crmwta_db:/var/lib/postgresql
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        reservations: { memory: 512M }
        limits: { memory: 1536M, cpus: "1.0" }

  # Aplica as migrações, cria o papel de login da API e, na primeira vez, a
  # empresa WTA e o superadministrador. Termina depois (aparece como 0/1).
  migrate:
    image: ${IMAGEM_API}
    user: root
    command: ["sh", "/app/db/stack-migrate.sh"]
    healthcheck:
      disable: true
    environment:
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-}
    secrets: [crmwta_db_password, crmwta_api_db_password, crmwta_bootstrap_password]
    networks: [interna]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
      resources:
        limits: { memory: 256M }

  api:
    image: ${IMAGEM_API}
    command: ["sh", "-c", "export DATABASE_URL=\"postgres://crm_api:$$(cat /run/secrets/crmwta_api_db_password)@db:5432/crm\"; exec node dist/main.js"]
    environment: *api-env
    secrets: [crmwta_api_db_password, crmwta_master_keys, crmwta_smtp_pass]
    volumes:
      - crmwta_arquivos:/data/files
      # Pasta das cópias: a API lista, baixa e recebe cópias e escreve pedidos;
      # quem copia e restaura é o serviço "backup".
      - crmwta_backup:/backups
    networks: [interna, traefik]
    labels: *api-labels
    deploy:
      # Os arquivos ficam num volume local: a API roda no mesmo nó do banco.
      placement:
        constraints: [node.role == manager]
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
      resources:
        reservations: { memory: 256M }
        limits: { memory: 512M, cpus: "1.0" }
      labels: *api-labels

  web:
    image: ${IMAGEM_WEB}
    environment:
      API_INTERNAL_URL: http://api:3001
    networks: [interna, traefik]
    labels: *web-labels
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      resources:
        reservations: { memory: 256M }
        limits: { memory: 512M, cpus: "1.0" }
      labels: *web-labels

  # Cópias de segurança: banco e arquivos, uma vez por dia (BACKUP_HORA), com
  # retenção de 7 diárias, 4 semanais e 6 mensais; executa também os pedidos da
  # Plataforma (cópia agora, restaurar uma empresa ou o banco inteiro).
  backup:
    image: ${IMAGEM_API}
    user: root
    command: ["node", "/app/dist/cli/backup-agent.js"]
    healthcheck:
      disable: true
    environment:
      PGHOST: db
      PGDATABASE: crm
      PGUSER: postgres
      PGPASSWORD_FILE: /run/secrets/crmwta_db_password
      BACKUP_HORA: ${BACKUP_HORA:-03:30}
      TZ: ${TZ:-America/Sao_Paulo}
    secrets: [crmwta_db_password]
    volumes:
      - crmwta_backup:/backups
      - crmwta_arquivos:/data/files
    networks: [interna]
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { memory: 512M }

secrets:
  crmwta_db_password: { external: true }
  crmwta_api_db_password: { external: true }
  crmwta_master_keys: { external: true }
  crmwta_smtp_pass: { external: true }
  crmwta_bootstrap_password: { external: true }

volumes:
  crmwta_db:
  crmwta_backup:
  crmwta_arquivos:

networks:
  interna:
    driver: overlay
    attachable: false
  traefik:
    external: true
    name: ${REDE_TRAEFIK}
